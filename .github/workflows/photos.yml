# Tâche ponctuelle : télécharge les photos libres de droits (Unsplash)
# listées dans images/photos/credits.json et les range dans le site.
name: Télécharger les photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["images/photos/credits.json", ".github/workflows/photos.yml"]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger et alléger les photos
        run: |
          for ligne in $(jq -r '.[] | "\(.f)|\(.id)"' images/photos/credits.json); do
            f="${ligne%%|*}"; id="${ligne#*|}"
            code=$(curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -w "%{http_code} %{url_effective}" "https://unsplash.com/photos/${id}/download?force=true&w=1000" -o "images/photos/${f}.jpg")
            echo "${f} ${code} $(file -b images/photos/${f}.jpg | cut -c1-60)" >> images/photos/journal.txt
            file images/photos/${f}.jpg | grep -q JPEG || rm -f images/photos/${f}.jpg
          done
          cat images/photos/journal.txt
      - name: Enregistrer
        run: |
          git config user.name "robot-stats"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/photos
          git diff --staged --quiet || (git commit -qm "Photos libres de droits (Unsplash)" && git pull -q --rebase -X theirs && git push -q)
