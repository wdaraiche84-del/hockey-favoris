# Tâche temporaire : explore les données de la LAH et des juniors.
name: Explorer les autres ligues
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/explorer.mjs"]
jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/explorer.mjs
