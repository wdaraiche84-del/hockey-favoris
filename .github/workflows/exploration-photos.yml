# TEMPORAIRE : essai du robot des photos (le bac à sable ne peut pas joindre Wikimedia). À supprimer.
name: Exploration photos
on:
  push:
    branches: [claude/magical-wozniak-ido4qi]
    paths: [".github/workflows/exploration-photos.yml", "scripts/maj-photos.mjs"]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for i in 1 2 3 4 5; do node scripts/maj-photos.mjs; done 2>&1 | tee /tmp/journal.txt
      - run: |
          cp data/photos.json /tmp/photos.json
          git config user.name "robot-exploration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin exploration && git checkout exploration || git checkout --orphan exploration
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p photos && cp /tmp/photos.json /tmp/journal.txt photos/
          git add photos && git commit -qm "Essai photos" && git push -q origin exploration
